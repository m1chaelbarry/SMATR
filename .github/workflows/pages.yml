name: Sprawdzenie i publikacja SMATR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publikuj sprawdzoną stronę w GitHub Pages'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: smatr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-env.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          path: dist
  deploy:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
